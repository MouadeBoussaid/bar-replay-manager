appId: com.mouad.barreplaymanager
productName: BAR Replay Manager
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
  # icon: build/icon.ico   # add a 256x256 .ico here to brand the app + installer
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName} Setup ${version}.${ext}
